<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse &middot; Portail Multi-Modes</title>
  <link rel="icon" type="image/png" href="evoX.W2JB.png">
  <style>
    :root {
      --bg-main: #030712;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --primary-btn: #0284c7;
      --primary-btn-hover: #0369a1;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(2, 132, 199, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(56, 189, 248, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 960px;
    }

    /* Top Bar Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-version {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Rescue / zFTPd Button */
    .btn-rescue {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-rescue:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
    }

    .sys-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 9999px;
    }

    .sys-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* Console Container */
    .console-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
    }

    .console-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .console-header::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-card);
    }

    #console {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 16px;
      min-height: 250px;
      max-height: 480px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #38bdf8;
      word-break: break-word;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="header">
    <div class="brand-wrap">
      <img src="evoX.W2JB.png" alt="evoX logo" class="brand-logo" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">
          <span>PS5-Relapse</span>
          <span class="brand-version">vLite1</span>
        </div>
        <div class="brand-subtitle">Hôte d'exploitation WebKit &middot; Exécution des scripts</div>
      </div>
    </div>
    
    <div class="header-actions">
      <a class="btn-rescue">
        🛠 Darkmor
      </a>
      
      <div class="sys-badge" id="envBadge">
        <span class="sys-dot"></span>
        <span id="envLabel">Détection de la console…</span>
      </div>
    </div>
  </header>

  <!-- Section Output / Console -->
  <div class="console-wrapper">
    <div class="console-header">Journal d'exécution (Console)</div>
    <div id="console"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>PS5 WebKit W2JB &middot; Architecture Modulaire evoX &middot; Accès direct via Guide Utilisateur ou Navigateur</span>
  </footer>

</div>

<script>
  // Détection de l'environnement PS5
  (function detectEnv() {
    const ua = navigator.userAgent;
    const envLabel = document.getElementById("envLabel");
    
    if (/PlayStation 5/i.test(ua)) {
      const match = ua.match(/PlayStation 5\/([0-9\.]+)/i);
      const fw = match ? match[1] : "Compatible";
      envLabel.textContent = "PlayStation 5 (FW " + fw + ")";
    } else {
      envLabel.textContent = "Mode Test / PC";
    }
  })();
</script>

<!-- Scripts originaux PS5-Relapse -->
<script src="./src/firmware.js"></script>
<script src="./src/main.js"></script>
<script src="./src/rop.js"></script>
<script src="./src/utils/syscalls.js"></script>
<script type="module" src="./src/site.js"></script>

</body>
</html>
